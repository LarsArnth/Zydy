<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Straffespark: målet med net, målmanden der kaster sig – og bolden på vej i hjørnet -->
  <rect width="512" height="512" rx="96" fill="#0e2415"/>
  <!-- Græsset -->
  <rect y="330" width="512" height="182" fill="#4c9e53"/>
  <!-- Nettet -->
  <g stroke="#ffffff" stroke-opacity=".35" stroke-width="6">
    <path d="M120 130v200M180 130v200M240 130v200M300 130v200M360 130v200"/>
    <path d="M76 180h360M76 235h360M76 290h360"/>
  </g>
  <!-- Målet -->
  <path d="M76 340V130h360v210" fill="none" stroke="#f8f8f8" stroke-width="22" stroke-linecap="round"/>
  <!-- Målmanden, der kaster sig mod venstre -->
  <g transform="rotate(-24 256 280)">
    <rect x="216" y="220" width="80" height="110" rx="28" fill="#e3655b"/>
    <circle cx="256" cy="192" r="34" fill="#f0c8a0"/>
    <path d="M222 182a34 34 0 0168 0z" fill="#4a3120"/>
    <path d="M226 240l-70 -34M286 240l70 -34" stroke="#e3655b" stroke-width="20" stroke-linecap="round"/>
    <circle cx="150" cy="204" r="20" fill="#ffd447"/>
    <circle cx="362" cy="204" r="20" fill="#ffd447"/>
    <path d="M232 328l-24 54M280 328l24 54" stroke="#f0c8a0" stroke-width="20" stroke-linecap="round"/>
  </g>
  <!-- Bolden på vej i det øverste hjørne -->
  <circle cx="120" cy="185" r="46" fill="#ffffff"/>
  <path d="M120 160l24 17-9 28h-30l-9-28z" fill="#20303c"/>
  <!-- Fartstriber efter bolden -->
  <g stroke="#ffd447" stroke-width="14" stroke-linecap="round">
    <path d="M196 268l52-44"/>
    <path d="M232 296l44-38"/>
  </g>
</svg>
