<svg viewBox="0 0 512 512"><defs>
  <radialGradient id="pd-bg" cx=".5" cy=".55" r=".75"><stop offset="0" stop-color="#4a2b3a"/><stop offset="1" stop-color="#140f18"/></radialGradient>
  <radialGradient id="pd-glod" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff3c14" stop-opacity=".75"/><stop offset="1" stop-color="#ff3c14" stop-opacity="0"/></radialGradient>
  <radialGradient id="pd-kugle" cx=".35" cy=".32" r=".75"><stop offset="0" stop-color="#ff9a7a"/><stop offset=".35" stop-color="#f0301c"/><stop offset="1" stop-color="#7a1008"/></radialGradient>
</defs>
  <rect width="512" height="512" fill="url(#pd-bg)"/>

  <!-- Gløden: bomben er lige ved at springe -->
  <circle cx="250" cy="300" r="210" fill="url(#pd-glod)"/>

  <!-- Hætte og lunte med gnist -->
  <rect x="218" y="146" width="64" height="40" rx="8" fill="#6b6f7a"/>
  <path d="M250 150 C 255 100, 300 80, 340 96" stroke="#c9a36b" stroke-width="16" stroke-linecap="round" fill="none"/>
  <g transform="translate(348 92)">
    <circle r="30" fill="#ffd447"/>
    <circle r="16" fill="#fff3b0"/>
    <path d="M0 -52 L6 -24 M0 52 L-6 24 M-52 0 L-24 -6 M52 0 L24 6 M-36 -36 L-16 -16 M36 36 L16 16 M36 -36 L16 -16 M-36 36 L-16 16"
      stroke="#ffd447" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Selve bomben -->
  <circle cx="250" cy="310" r="140" fill="url(#pd-kugle)"/>
  <ellipse cx="200" cy="250" rx="42" ry="24" transform="rotate(-35 200 250)" fill="#fff" opacity=".4"/>

  <!-- To hænder, der skal af med den -->
  <g fill="#ffd0a8" stroke="#8a5a3c" stroke-width="6">
    <path d="M52 400 q40 -40 80 -20 l30 16 q12 10 0 22 l-60 10 q-40 4 -50 -28 z"/>
    <path d="M460 400 q-40 -40 -80 -20 l-30 16 q-12 10 0 22 l60 10 q40 4 50 -28 z"/>
  </g>
</svg>
