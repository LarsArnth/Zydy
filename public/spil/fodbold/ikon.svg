<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fodbold: banen set oppefra med målet øverst, to spillere og bolden på vej i mål -->
  <rect width="512" height="512" rx="96" fill="#2f8f46"/>
  <!-- Striber i græsset -->
  <g fill="#36a04f">
    <rect x="0" y="0" width="512" height="86"/>
    <rect x="0" y="172" width="512" height="86"/>
    <rect x="0" y="344" width="512" height="86"/>
  </g>
  <rect width="512" height="512" rx="96" fill="none" stroke="#e9edf2" stroke-width="22"/>
  <!-- Kridtstregerne -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="10">
    <path d="M40 380h432"/>
    <circle cx="256" cy="380" r="70"/>
    <path d="M136 40v112h240V40"/>
  </g>
  <!-- Målet med net -->
  <rect x="186" y="14" width="140" height="30" fill="#ffffff" fill-opacity=".25"/>
  <path d="M186 44V14h140v30" fill="none" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
  <!-- Spilleren, der har skudt -->
  <g transform="translate(170 300) rotate(-30)">
    <ellipse cx="0" cy="0" rx="42" ry="27" fill="#e8413c" stroke="#ffffff" stroke-width="6"/>
    <circle cx="0" cy="0" r="19" fill="#f0c8a0"/>
    <path d="M-19 3a19 19 0 0038 0z" fill="#4a3120"/>
  </g>
  <!-- Målmanden, der kaster sig -->
  <g transform="translate(300 70) rotate(15)">
    <ellipse cx="0" cy="0" rx="40" ry="25" fill="#ff9f1c" stroke="#1a1a1a" stroke-width="6"/>
    <circle cx="-40" cy="-6" r="11" fill="#ffffff"/>
    <circle cx="40" cy="-6" r="11" fill="#ffffff"/>
    <circle cx="0" cy="0" r="17" fill="#c68e5d"/>
  </g>
  <!-- Bolden på vej i hjørnet, med fartstriber -->
  <g stroke="#ffffff" stroke-opacity=".6" stroke-width="12" stroke-linecap="round">
    <path d="M200 205l-24 40"/>
    <path d="M232 214l-20 34"/>
  </g>
  <circle cx="226" cy="150" r="34" fill="#ffffff" stroke="#222" stroke-width="4"/>
  <path d="M226 134l15 11-6 18h-18l-6-18z" fill="#222"/>
</svg>
