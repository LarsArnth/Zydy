<svg viewBox="0 0 512 512"><defs>
  <pattern id="pa-tern" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0v32" fill="none" stroke="#e2dccb" stroke-width="3"/>
  </pattern>
</defs>
  <!-- Selve papiret med de fine tern -->
  <rect width="512" height="512" fill="#f7f3e7"/>
  <rect width="512" height="512" fill="url(#pa-tern)"/>

  <!-- Modstanderens område oppe i hjørnet -->
  <rect x="352" y="32" width="128" height="128" fill="#ff4d5e" opacity=".78"/>
  <rect x="352" y="32" width="128" height="128" fill="none" stroke="#b7363f" stroke-width="8"/>

  <!-- Mit eget område nede til venstre -->
  <rect x="32" y="288" width="192" height="192" fill="#18c98a" opacity=".78"/>
  <rect x="32" y="288" width="192" height="192" fill="none" stroke="#119063" stroke-width="8"/>

  <!-- Sløjfen: ud fra området, rundt om, og på vej hjem igen -->
  <path d="M128 288 V160 H320 V352" fill="none" stroke="#18c98a" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
  <path d="M128 288 V160 H320 V352" fill="none" stroke="#18c98a" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Klatten forrest på stregen, med øjnene i køreretningen -->
  <g>
    <rect x="288" y="336" width="64" height="64" rx="18" fill="#18c98a" stroke="#fff" stroke-width="8"/>
    <circle cx="306" cy="378" r="9" fill="#fff"/><circle cx="334" cy="378" r="9" fill="#fff"/>
    <circle cx="306" cy="384" r="4.5" fill="#0b5c3e"/><circle cx="334" cy="384" r="4.5" fill="#0b5c3e"/>
  </g>

  <!-- Papirets farlige kant -->
  <rect x="7" y="7" width="498" height="498" fill="none" stroke="#ff4d5e" stroke-width="14" opacity=".55"/>
</svg>
