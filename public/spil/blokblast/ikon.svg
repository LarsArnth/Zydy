    <rect x="256" y="256" width="88" height="88" rx="20"/><rect x="356" y="256" width="88" height="88" rx="20"/>
    <rect x="56" y="356" width="88" height="88" rx="20"/><rect x="156" y="356" width="88" height="88" rx="20"/>
    <rect x="256" y="356" width="88" height="88" rx="20"/><rect x="356" y="356" width="88" height="88" rx="20"/>
