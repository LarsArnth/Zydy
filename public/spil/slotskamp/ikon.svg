<svg viewBox="0 0 512 512"><defs>
  <linearGradient id="sk-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b5a3a"/><stop offset="1" stop-color="#1d2745"/></linearGradient>
</defs>
  <rect width="512" height="512" fill="url(#sk-bg)"/>

  <!-- Græsset: modstanderens halvdel øverst, ens egen nederst -->
  <rect y="0" width="512" height="228" fill="#3c7a4b"/>
  <rect y="284" width="512" height="228" fill="#42874f"/>

  <!-- Floden og broen -->
  <rect y="228" width="512" height="56" fill="#2f6fb3"/>
  <rect y="228" width="512" height="6" fill="#ffffff" opacity=".18"/>
  <rect x="196" y="218" width="120" height="76" rx="10" fill="#8a6440"/>
  <g fill="#000000" opacity=".18">
    <rect x="196" y="236" width="120" height="8"/><rect x="196" y="256" width="120" height="8"/>
  </g>

  <!-- Modstanderens tårn (rødt) -->
  <g>
    <rect x="176" y="60" width="160" height="130" rx="12" fill="#c03844"/>
    <rect x="196" y="80" width="120" height="90" rx="8" fill="#ff5c66"/>
    <g fill="#c03844">
      <rect x="176" y="36" width="36" height="30"/><rect x="238" y="36" width="36" height="30"/><rect x="300" y="36" width="36" height="30"/>
    </g>
  </g>

  <!-- Eget tårn (blåt) -->
  <g>
    <rect x="176" y="326" width="160" height="130" rx="12" fill="#2c5fb8"/>
    <rect x="196" y="346" width="120" height="90" rx="8" fill="#4d8dff"/>
    <g fill="#2c5fb8">
      <rect x="176" y="302" width="36" height="30"/><rect x="238" y="302" width="36" height="30"/><rect x="300" y="302" width="36" height="30"/>
    </g>
  </g>

  <!-- To tropper på vej over broen -->
  <circle cx="256" cy="300" r="34" fill="#4d8dff" stroke="#1d2745" stroke-width="6"/>
  <circle cx="256" cy="212" r="30" fill="#ff5c66" stroke="#1d2745" stroke-width="6"/>

  <!-- Kronen: det er den, det hele handler om -->
  <path d="M368 396l16-46 22 28 22-28 16 46z" fill="#ffd447"/>
  <path d="M84 150l16-46 22 28 22-28 16 46z" fill="#ffd447"/>
</svg>
