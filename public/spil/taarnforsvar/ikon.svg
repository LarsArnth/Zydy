<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Tårnforsvar: stien der snor sig, et tårn der skyder – og monstrene på vej mod porten -->
  <rect width="512" height="512" rx="96" fill="#1a2b20"/>
  <!-- Græsset i tern, som på banen -->
  <g fill="#2f6640">
    <rect x="0" y="0" width="128" height="128"/><rect x="256" y="0" width="128" height="128"/>
    <rect x="128" y="128" width="128" height="128"/><rect x="384" y="128" width="128" height="128"/>
    <rect x="0" y="256" width="128" height="128"/><rect x="256" y="256" width="128" height="128"/>
    <rect x="128" y="384" width="128" height="128"/><rect x="384" y="384" width="128" height="128"/>
  </g>
  <!-- Stien, monstrene går ad -->
  <path d="M96 40v120h300v150H150v180" fill="none" stroke="#c3a06a" stroke-width="74"
    stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Porten nederst, den man skal forsvare -->
  <g>
    <rect x="104" y="404" width="92" height="76" rx="10" fill="#8d93a8"/>
    <rect x="132" y="436" width="36" height="44" rx="6" fill="#4a2f1d"/>
    <path d="M150 404v-46" stroke="#ffd447" stroke-width="10"/>
    <path d="M152 360l46 14-46 14z" fill="#ffd447"/>
  </g>
  <!-- Bueskyttetårnet -->
  <g>
    <rect x="222" y="352" width="86" height="76" rx="18" fill="#3c4a41"/>
    <rect x="222" y="352" width="86" height="26" rx="13" fill="#4d5f53"/>
    <path d="M286 372a34 34 0 010 44" fill="none" stroke="#3ddc84" stroke-width="14" stroke-linecap="round"/>
    <path d="M272 394h64" stroke="#3ddc84" stroke-width="12" stroke-linecap="round"/>
    <g fill="#ffd447"><circle cx="240" cy="416" r="7"/><circle cx="262" cy="416" r="7"/><circle cx="284" cy="416" r="7"/></g>
  </g>
  <!-- Pilen på vej mod monsteret -->
  <circle cx="356" cy="394" r="9" fill="#ffe9a8"/>
  <!-- Monstrene på stien -->
  <g>
    <circle cx="410" cy="394" r="38" fill="#ff4d5e"/>
    <path d="M378 372v-30l24 18 16-26 16 26 24-18v30z" fill="#ffd447"/>
    <circle cx="397" cy="392" r="12" fill="#fff"/><circle cx="425" cy="392" r="12" fill="#fff"/>
    <circle cx="397" cy="394" r="6" fill="#12200f"/><circle cx="425" cy="394" r="6" fill="#12200f"/>
  </g>
  <g>
    <path d="M232 202c-8-42 16-58 40-58s48 16 40 58z" fill="#7bd88f"/>
    <circle cx="258" cy="184" r="11" fill="#fff"/><circle cx="286" cy="184" r="11" fill="#fff"/>
    <circle cx="258" cy="186" r="5" fill="#12200f"/><circle cx="286" cy="186" r="5" fill="#12200f"/>
  </g>
</svg>
