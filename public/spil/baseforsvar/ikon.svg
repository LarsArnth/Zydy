<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Baseforsvar: rådhuset i midten, mure omkring, et tårn der skyder – og zombierne udenfor -->
  <rect width="512" height="512" rx="96" fill="#1b1e28"/>
  <!-- Græsset i tern, som på banen -->
  <g fill="#2f3a2c">
    <rect x="64" y="64" width="128" height="128"/>
    <rect x="192" y="192" width="128" height="128"/>
    <rect x="320" y="64" width="128" height="128"/>
    <rect x="64" y="320" width="128" height="128"/>
    <rect x="320" y="320" width="128" height="128"/>
  </g>
  <g fill="#344031">
    <rect x="192" y="64" width="128" height="128"/>
    <rect x="64" y="192" width="128" height="128"/>
    <rect x="320" y="192" width="128" height="128"/>
    <rect x="192" y="320" width="128" height="128"/>
  </g>
  <!-- Murene om rådhuset -->
  <g fill="#8d9aa8">
    <rect x="200" y="140" width="112" height="52" rx="8"/>
    <rect x="200" y="320" width="112" height="52" rx="8"/>
    <rect x="128" y="212" width="52" height="88" rx="8"/>
    <rect x="332" y="212" width="52" height="88" rx="8"/>
  </g>
  <!-- Rådhuset i midten -->
  <rect x="204" y="246" width="104" height="74" rx="8" fill="#6b4a2a"/>
  <path d="M192 248l64-52 64 52z" fill="#ff9f43"/>
  <rect x="242" y="276" width="28" height="44" fill="#ffe9a8"/>
  <rect x="250" y="166" width="12" height="40" fill="#ffd447"/>
  <path d="M262 170l44 14-44 14z" fill="#ffd447"/>
  <!-- Zombierne på vej ind fra hjørnerne -->
  <g fill="#7bd88f">
    <circle cx="108" cy="108" r="30"/>
    <circle cx="404" cy="404" r="30"/>
  </g>
  <g fill="#fff">
    <circle cx="98" cy="102" r="9"/><circle cx="120" cy="102" r="9"/>
    <circle cx="394" cy="398" r="9"/><circle cx="416" cy="398" r="9"/>
  </g>
  <g fill="#1b0f12">
    <circle cx="100" cy="104" r="4"/><circle cx="122" cy="104" r="4"/>
    <circle cx="396" cy="400" r="4"/><circle cx="418" cy="400" r="4"/>
  </g>
  <!-- Skydetårnet, der har den ene på kornet -->
  <rect x="370" y="112" width="68" height="60" rx="14" fill="#414b5c"/>
  <rect x="370" y="112" width="68" height="18" rx="9" fill="#52607a"/>
  <g stroke="#3ddc84" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M418 142a24 24 0 0 0-42-18"/>
    <path d="M410 136L356 108"/>
  </g>
  <circle cx="230" cy="86" r="8" fill="#eafff2"/>
  <circle cx="176" cy="96" r="7" fill="#eafff2"/>
</svg>
